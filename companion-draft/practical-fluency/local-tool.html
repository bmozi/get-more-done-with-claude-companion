<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volunteer kit handoff</title><style>body{font:18px/1.6 Arial;max-width:38rem;margin:3rem auto;padding:1rem;color:#173345;background:#faf9f4}label{display:block;margin:1rem 0}button,input{font:inherit;padding:.4rem}button{margin:.4rem}input[type=text]{width:100%}#status{background:#e9eef0;padding:1rem}</style><h1>Volunteer kit handoff</h1><p>Fictional practice. Data stays in this browser profile; export for a portable copy.</p><p>Kit: training A</p><label><input type="checkbox" data-item="sleeves">sleeves</label><label><input type="checkbox" data-item="cards">cards</label><label><input type="checkbox" data-item="pencil">pencil</label><button id="export">Export handoff</button><button id="reset">Reset local record</button><p id="status" role="status"></p><script>const checks=[...document.querySelectorAll('[data-item]')];function render(){const s=JSON.parse(localStorage.getItem('kit')||'{}');checks.forEach(el=>el.checked=!!s[el.dataset.item]);document.querySelector('#status').textContent=checks.some(el=>el.checked)?'Local checks saved. Export before reset.':'No items checked. Begin with the supplied kit list.'}checks.forEach(el=>el.onchange=()=>{const s={};checks.forEach(x=>s[x.dataset.item]=x.checked);localStorage.setItem('kit',JSON.stringify(s));render()});document.querySelector('#reset').onclick=()=>{localStorage.removeItem('kit');render()};function report(){return 'Kit: training A\n'+checks.map(el=>el.dataset.item+': '+(el.checked?'checked':'not checked')).join('\n')+'\n'};render();document.querySelector('#export').onclick=()=>{const b=new Blob([report()],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='handoff.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
